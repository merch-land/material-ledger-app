<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 电子料台账协作平台</title>
<style>
/* ===== Design Tokens ===== */
:root {
  --surface-1:      #fcfcfb;
  --page-plane:     #f5f4f0;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --border:         rgba(11,11,11,0.08);
  --s1: #2a78d6;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --border:         rgba(255,255,255,0.08);
  }
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page-plane);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.login-page{
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background: linear-gradient(160deg, #eef2f7 0%, #f0f0ea 40%, #e8eaf0 100%);
}

.login-card{
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 28px 32px;
  width: 420px;
  max-width: 90vw;
  box-shadow: 0 4px 32px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
}

.login-icon{
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, #2a78d6, #1a56c7);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin: 0 auto 20px;
  box-shadow: 0 4px 16px rgba(42,120,214,0.25);
}

.login-card h1{
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.login-card .subtitle{
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  margin-top: 4px;
  margin-bottom: 32px;
}

/* Flash messages */
.flash-msg{
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
}
.flash-success{background:#ecfdf3;color:#067647;border:1px solid #abefc6}
.flash-error{background:#fef3f2;color:#b42318;border:1px solid #fecdca}
.flash-info{background:#e8f0fe;color:#1a56c7;border:1px solid #b8d4fe}

/* Form */
.form-group{margin-bottom: 18px}
.form-label{
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.form-input{
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  color: var(--text-primary);
  background: var(--surface-1);
  transition: border-color .15s, box-shadow .15s;
}
.form-input:focus{
  outline: none;
  border-color: var(--s1);
  box-shadow: 0 0 0 3px rgba(42,120,214,0.12);
}
.form-input::placeholder{
  color: var(--text-muted);
  opacity: 0.7;
}

/* Password wrapper */
.pw-wrap{
  position: relative;
}
.pw-toggle{
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: var(--text-muted);
  padding: 4px;
  line-height: 1;
  transition: color .15s;
}
.pw-toggle:hover{color: var(--text-secondary)}

.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition: all .15s;
  letter-spacing: 0.02em;
}
.btn-primary{
  background: linear-gradient(135deg, #2a78d6, #1a56c7);
  color: #fff;
  width: 100%;
  box-shadow: 0 2px 8px rgba(42,120,214,0.3);
}
.btn-primary:hover{
  transform: translateY(-1px); box-shadow: 0 4px 12px rgba(42,120,214,0.3);
  box-shadow: 0 4px 16px rgba(42,120,214,0.35);
  transform: translateY(-1px);
}

/* Footer */
.login-footer{
  margin-top: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-icon">📦</div>
    <h1>电子料台账协作平台</h1>
    <p class="subtitle">多人协作 · 任务分配 · 数据填报</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
      <div class="flash-msg flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-input" placeholder="请输入用户名" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="password" class="form-input" placeholder="请输入密码" required>
          <button type="button" class="pw-toggle" id="pwToggle" title="显示密码">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">登 录</button>
    </form>

    <div class="login-footer">内部协作系统 · 仅限授权用户使用</div>
  </div>
</div>

<script>
// 密码显示/隐藏切换
document.getElementById('pwToggle').addEventListener('click', function() {
  var pw = document.getElementById('password');
  if (pw.type === 'password') {
    pw.type = 'text';
    this.textContent = '🙈';
  } else {
    pw.type = 'password';
    this.textContent = '👁';
  }
});
</script>
</body>
</html>
