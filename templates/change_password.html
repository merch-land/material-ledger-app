{% extends "base.html" %}
{% block content %}
<div style="max-width:500px;margin:0 auto">
  <div class="card">
    <div class="card-header">🔑 修改密码</div>

    {% if force_change %}
    <div class="info-box" style="background:#fff8e6;color:#b45309;border:1px solid #fcd34d;margin-bottom:16px">
      ⚠️ <strong>首次登录必须修改密码</strong><br>
      <span style="font-size:12px">默认密码不安全，请设置一个至少 <strong>8 位</strong>、包含<strong>字母+数字</strong>的新密码。</span>
    </div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label class="form-label">当前密码</label>
        <input type="password" name="old_password" class="form-input" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">新密码</label>
        <input type="password" name="new_password" class="form-input" required minlength="8" placeholder="至少8位，包含字母和数字">
      </div>
      <div class="form-group">
        <label class="form-label">确认新密码</label>
        <input type="password" name="confirm_password" class="form-input" required minlength="8" placeholder="再次输入新密码">
      </div>
      <div class="info-box" style="font-size:12px">
        💡 密码要求：至少 <strong>8 位</strong>，必须包含 <strong>字母 + 数字</strong>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">保存新密码</button>
        {% if not force_change %}
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline">取消</a>
        {% endif %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
