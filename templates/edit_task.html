{% extends "base.html" %}
{% block content %}
<div style="max-width:700px;margin:0 auto">
  <div class="card">
    <div class="card-header">⚙ 编辑任务 #{{ task.id }}</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label"><span class="required">*</span> 任务标题</label>
        <input type="text" name="title" class="form-input" value="{{ task.title }}" required>
      </div>
      <div class="form-group">
        <label class="form-label"><span class="required">*</span> 负责人</label>
        <select name="assigned_to" class="form-select" required>
          {% for m in members %}
          <option value="{{ m.id }}" {% if task.assigned_to == m.id %}selected{% endif %}>
            {{ m.display_name }}（{{ m.username }}）
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">计划完成日期</label>
        <input type="date" name="due_date" class="form-input" value="{{ task.due_date or '' }}">
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">💾 保存修改</button>
        <a href="{{ url_for('view_task', task_id=task.id) }}" class="btn btn-outline">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
